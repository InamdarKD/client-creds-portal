<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Client Credentials Portal</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <!-- ======================
         HOME PAGE
    ======================= -->

    <div id="homePage">

      <h1>Client Credentials Portal</h1>

      <!-- SEARCH -->

      <input
        type="text"
        id="searchInput"
        placeholder="Search Client..."
      >

      <!-- CLIENT LIST -->

      <div
        id="clientList"
        class="client-list"
      ></div>

    </div>

    <!-- ======================
         CLIENT PAGE
    ======================= -->

    <div
      id="credentialsSection"
      class="hidden"
    >

      <!-- TOP BAR -->

      <div class="top-bar">

        <button
          class="back-btn"
          onclick="goBack()"
        >
          ← Back
        </button>

      </div>

      <!-- CLIENT TITLE -->

      <h2 id="clientTitle"></h2>

      <!-- ======================
           USER CREDENTIALS
      ======================= -->

      <h3>User Credentials</h3>

      <table>

        <thead>

          <tr>
            <th>System</th>
            <th>URL</th>
            <th>Username</th>
            <th>Password</th>
          </tr>

        </thead>

        <tbody id="credentialsTable"></tbody>

      </table>

      <!-- ======================
           COMMUNICATION IDS
      ======================= -->

      <h3>Communication IDs</h3>

      <table>

        <thead>

          <tr>
            <th>System</th>
            <th>URL</th>
            <th>Communication User</th>
            <th>Password</th>
          </tr>

        </thead>

        <tbody id="communicationTable"></tbody>

      </table>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
