<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Client Credentials Portal</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <!-- =========================
         PAGE 1 : CLIENT LIST
    ========================== -->

    <div id="homePage">

      <h1>Client Credentials Portal</h1>

      <!-- SEARCH -->

      <input
        type="text"
        id="searchInput"
        placeholder="Search Client..."
      >

      <!-- ADD CLIENT -->

      <button
        class="add-btn"
        onclick="createClientPage()"
      >
        + Add Client
      </button>

      <!-- CLIENT LIST -->

      <div
        id="clientList"
        class="client-list"
      ></div>

    </div>

    <!-- =========================
         PAGE 2 : CLIENT DETAILS
    ========================== -->

    <div
      id="credentialsSection"
      class="hidden"
    >

      <!-- TOP ACTIONS -->

      <div class="top-bar">

        <button
          onclick="goBack()"
          class="back-btn"
        >
          ← Back
        </button>

        <button
          class="add-btn"
          onclick="addCredential()"
        >
          + Add Credential
        </button>

      </div>

      <!-- CLIENT NAME -->

      <h2 id="clientTitle"></h2>

      <!-- TABLE -->

      <table>

        <thead>

          <tr>
            <th>System</th>
            <th>URL</th>
            <th>Username</th>
            <th>Password</th>
          </tr>

        </thead>

        <tbody id="credentialsTable"></tbody>

      </table>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
